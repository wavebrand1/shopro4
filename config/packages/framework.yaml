# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
    html_sanitizer:
        sanitizers:
            app.page_content:
                allow_safe_elements: true
                allow_elements:
                    iframe: ['src', 'title', 'width', 'height', 'loading', 'frameborder', 'allow', 'referrerpolicy', 'allowfullscreen']
                allow_relative_links: true
                allow_relative_medias: true
                drop_elements: ['script', 'style', 'object', 'embed']
            app.email_content:
                allow_safe_elements: true
                allow_relative_links: false
                allow_relative_medias: false
                drop_elements: ['script', 'style', 'iframe', 'object', 'embed', 'form', 'input', 'button']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
