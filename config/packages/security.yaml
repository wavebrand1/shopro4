security:
    role_hierarchy:
        ROLE_ADMIN: ROLE_EDITOR
        ROLE_EDITOR: ROLE_USER
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin_users:
            entity:
                class: App\Identity\Domain\Entity\AdminUser
        site_users:
            entity:
                class: App\Identity\Domain\Entity\SiteUser

    firewalls:
        installer:
            pattern: ^/install(?:/|$)
            security: false
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            pattern: ^/admin(?:/|$)
            lazy: true
            provider: admin_users
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_dashboard
            login_throttling:
                limiter: App\Identity\Application\DynamicLoginRateLimiter
            remember_me:
                secret: '%kernel.secret%'
                name: SHOPRO_ADMIN_REMEMBER
                lifetime: 2592000
                path: /admin
                secure: auto
                httponly: true
                samesite: lax
            logout:
                path: admin_logout
                target: admin_login
        frontend:
            lazy: true
            provider: site_users
            form_login:
                login_path: site_login
                check_path: site_login
                enable_csrf: true
                csrf_token_id: site_authenticate
                default_target_path: app_home
            login_throttling:
                limiter: App\Identity\Application\DynamicLoginRateLimiter
            remember_me:
                secret: '%kernel.secret%'
                name: SHOPRO_SITE_REMEMBER
                lifetime: 2592000
                path: /
                secure: auto
                httponly: true
                samesite: lax
            logout:
                path: site_logout
                target: app_home

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin/password/(forgot|reset), roles: PUBLIC_ACCESS }
        - { path: ^/admin/(users|site-users|memberships|configuration/system|configuration/email-templates|configuration/languages|configuration/redirects|newsletter|logs|modules), roles: ROLE_ADMIN }
        - { path: ^/admin(?:/|$), roles: ROLE_EDITOR }
        - { path: ^/account, roles: ROLE_SITE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
